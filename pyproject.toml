[tool.poetry]
name = "pan26-generative-authorship-detection"
version = "0.1.0"
description = ""
authors = ["Janek Bevendorff <janek.bevendorff@uni-weimar.de>"]
readme = "README.md"
packages = [
    { include = "pan26_genai_detection" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
click = "^8.3.3"
gnews = "^0.4.3"
newspaper3k = "^0.2.8"
betterproto = "^1.2.5"
pandas = "^3.0.2"
numpy = "^2.4.4"
transformers = "^5.6.2"
torch = "^2.11.0"
openai = "^2.32.0"
jsonschema = "^4.26.0"
markdown = "^3.10.2"
resiliparse = "^0.16.0"
backoff = "^2.2.1"
accelerate = "^1.13.0"
bitsandbytes = "^0.49.2"
tqdm = "^4.67.3"
jinja2 = "^3.1.6"
google-cloud-aiplatform = "^1.149.0"
matplotlib = "^3.10.9"
seaborn = "^0.13.2"
optimum = "^2.1.0"
more-itertools = "^11.0.2"
pyppmd = "^1.3.1"
scikit-learn = "^1.8.0"
tira = "^0.0.198"
nltk = "^3.9.4"
sentencepiece = "^0.2.1"
notebook = "^7.5.5"
translators = "^6.0.4"

[tool.poetry.scripts]
summarize = 'pan26_genai_detection.dataset.summarize:main'
news-source = 'pan26_genai_detection.dataset.news_source:main'
llm-generate = 'pan26_genai_detection.dataset.llm_generate:main'
dataset-sample = 'pan26_genai_detection.dataset.dataset_sample:main'
dataset-paraphrase = 'pan26_genai_detection.dataset.paraphrase:main'
pan26-baseline = 'pan26_genai_detection.baselines.cli:main'
pan26-evaluator = 'pan26_genai_detection.evaluator.evaluator:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
